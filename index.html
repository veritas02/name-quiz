<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>이름을 맞춰라</title>
<style>
:root{--pink:#ff72ae;--pink2:#ffa8cb;--mint:#75dfc2;--yellow:#ffd66f;--ink:#46394b;--danger:#ef6c83;--ok:#38bf88;}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color:var(--ink)}
body{min-height:100vh;background:radial-gradient(circle at 10% 8%,#ffd9e8 0 8%,transparent 9%),radial-gradient(circle at 90% 12%,#fff0a2 0 9%,transparent 10%),linear-gradient(145deg,#fff7fb,#fff5de);}
button,input{font:inherit}
.app{width:min(760px,100%);min-height:100vh;margin:auto;padding:22px 16px 36px;display:flex;flex-direction:column}
.logo{text-align:center;font-size:clamp(34px,7vw,54px);font-weight:1000;letter-spacing:-2px;margin:8px 0 3px}
.logo span{color:var(--pink)}
.sub{text-align:center;font-weight:800;color:#8c778b;margin-bottom:18px}
.screen{display:none} .screen.active{display:block;animation:pop .22s ease}
@keyframes pop{from{opacity:.2;transform:scale(.985)}to{opacity:1;transform:scale(1)}}
.card{background:#ffffffed;border:3px solid white;border-radius:30px;padding:22px;box-shadow:0 18px 50px #8d5f7b20,inset 0 0 0 1px #f5d9e6;}
.center{text-align:center}
.hero{font-size:72px;line-height:1;margin-top:4px}
.input{width:100%;padding:16px 18px;border-radius:18px;border:3px solid #efc8da;outline:0;background:#fff;text-align:center;font-size:20px;font-weight:900;color:var(--ink)}
.input:focus{border-color:var(--pink);box-shadow:0 0 0 5px #ff72ae1b}
.btn{width:100%;border:0;border-radius:18px;padding:15px 18px;cursor:pointer;background:linear-gradient(#ff97c5,#ff72ae);color:#fff;font-size:19px;font-weight:1000;box-shadow:0 8px 0 #cf5b90;transition:.08s}
.btn:active{transform:translateY(5px);box-shadow:0 3px 0 #cf5b90}
.btn.alt{background:linear-gradient(#93ead7,#66d6bd);box-shadow:0 8px 0 #42b59d;color:#245047}
.badges{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:8px 0 12px}
.badge{background:#fff0f7;border:2px solid #ffd4e5;border-radius:999px;padding:8px 12px;font-weight:900}
.progress{height:16px;background:#f1e6ed;border-radius:99px;overflow:hidden;margin-bottom:14px}
.progress>div{height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--yellow),var(--pink));transition:.25s}
.photoCard{width:min(440px,92vw);height:min(470px,98vw);margin:0 auto 18px;background:#fff;border-radius:28px;border:7px solid white;box-shadow:0 14px 32px #6e4e6722;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photoCard img{width:100%;height:100%;object-fit:contain;background:#fff;display:block}
.status{min-height:34px;text-align:center;font-size:19px;font-weight:1000;margin:9px 0}
.status.good{color:var(--ok)} .status.bad{color:var(--danger);animation:shake .28s ease}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
.hof{margin-top:20px}
.hofrow{display:grid;grid-template-columns:54px 1fr auto;align-items:center;gap:10px;background:white;border:2px solid #f3d9e6;border-radius:17px;padding:12px 14px;margin:9px 0;text-align:left}
.medal{font-size:29px;text-align:center} .score{font-size:18px;font-weight:1000} .meta{font-size:12px;color:#8f7b8c;margin-top:3px} .small{font-size:13px;line-height:1.55;color:#8e7f8e}
.finalScore{font-size:62px;font-weight:1000;color:var(--pink);margin:6px 0}
.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#fff8;backdrop-filter:blur(4px);z-index:50}
.overlay.show{display:flex}
.popbox{background:#fff;border:5px solid white;border-radius:34px;padding:35px 30px;text-align:center;box-shadow:0 20px 70px #5d3f5938}
.bigemoji{font-size:82px} .bigtext{font-size:38px;font-weight:1000} .yay{color:var(--ok)} .cry{color:var(--danger)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:49} .confetti i{position:absolute;width:11px;height:18px;border-radius:4px;animation:fall 1.2s linear forwards}
@keyframes fall{from{transform:translateY(-10vh) rotate(0);opacity:1}to{transform:translateY(110vh) rotate(720deg);opacity:.85}}

.answerPanel{
  display:none;
  margin-top:18px;
  padding-top:18px;
  border-top:2px dashed #f1ccdc;
}
.answerPanel.show{display:block;animation:pop .22s ease}
.answerTitle{
  font-size:24px;
  font-weight:1000;
  margin:2px 0 14px;
  color:#46394b;
}
.answerGrid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
}
.answerCard{
  background:#fff;
  border:2px solid #f3d7e4;
  border-radius:18px;
  padding:8px;
  box-shadow:0 7px 18px #754d6720;
}
.answerPhoto{
  width:100%;
  aspect-ratio:1/1;
  border-radius:13px;
  overflow:hidden;
  background:#fafafa;
  display:flex;
  align-items:center;
  justify-content:center;
}
.answerPhoto img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}
.answerName{
  padding:9px 3px 4px;
  text-align:center;
  font-size:18px;
  font-weight:1000;
  color:#46394b;
}
@media(max-width:620px){
  .answerGrid{grid-template-columns:repeat(2,1fr)}
}

.footer{margin-top:auto;padding-top:18px;text-align:center;font-size:12px;color:#9a8998}
@media(max-width:520px){.card{padding:17px 14px}.photoCard{height:430px}}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="app">
 <div class="logo"><span>♥</span> 이름을 맞춰라 <span>♥</span></div>
 <div class="sub">사진 속 얼굴을 보고 이름을 입력하세요!</div>
 <section id="start" class="screen active">
  <div class="card center">
   <div class="hero">🎮</div>
   <h2>도전자 이름을 적어주세요</h2>
   <p class="small">총 22문제입니다. 사용자가 지정한 정답표 그대로 적용했고, 문제는 시작할 때마다 랜덤으로 섞입니다. 틀려도 다음 문제로 넘어가며 정답 개수로 점수가 기록됩니다.</p>
   <input id="playerName" class="input" maxlength="20" placeholder="참여자 이름" autocomplete="off">
   <div style="height:13px"></div>
   <button id="startBtn" class="btn">게임 시작!</button>
   <div class="hof"><h3>🏆 명예의 전당 TOP 3</h3><div id="hofStart"></div></div>
  </div>
 </section>
 <section id="game" class="screen">
  <div class="card">
   <div class="badges">
    <div id="playerBadge" class="badge">도전자</div>
    <div class="badge">문제 <span id="attempted">0</span> / 22</div>
    <div class="badge">정답 <span id="correct">0</span></div>
   </div>
   <div class="progress"><div id="bar"></div></div>
   <div class="photoCard"><img id="face" alt="퀴즈 얼굴 사진"></div>
   <input id="answer" class="input" placeholder="이름을 입력하세요" autocomplete="off" autocapitalize="off">
   <div id="status" class="status"></div>
   <button id="submitBtn" class="btn">정답 확인</button>
  </div>
 </section>
 <section id="final" class="screen">
  <div class="card center">
   <div class="hero">👑</div>
   <h1 style="margin:4px 0">게임 완료!</h1>
   <div id="finalName" style="font-size:23px;font-weight:1000"></div>
   <div id="finalScore" class="finalScore"></div>
   <div id="finalDetail" class="small"></div>
   <div style="height:15px"></div>
   <button id="answerBtn" class="btn alt">얼굴 · 이름 정답 보기</button>
   <div id="answerPanel" class="answerPanel">
    <div class="answerTitle">정답 모아보기</div>
    <div id="answerGrid" class="answerGrid"></div>
   </div>
   <div style="height:12px"></div>
   <button id="againBtn" class="btn">다시 도전!</button>
   <div style="height:12px"></div>
   <button id="homeBtn" class="btn alt">처음 화면으로</button>
   <div class="hof"><h2>🏆 명예의 전당 TOP 3</h2><div id="hofFinal"></div></div>
  </div>
 </section>
 <div class="footer">정답 1개당 100점입니다. 동점이면 더 최근에 완료한 사람이 위에 표시됩니다.</div>
</div>
<div id="overlay" class="overlay"><div class="popbox"><div id="ovEmoji" class="bigemoji"></div><div id="ovText" class="bigtext"></div></div></div>
<div id="confetti" class="confetti"></div>

const SUPABASE_URL="PASTE_YOUR_SUPABASE_PROJECT_URL_HERE";
const SUPABASE_PUBLISHABLE_KEY="PASTE_YOUR_SUPABASE_PUBLISHABLE_KEY_HERE";
const leaderboardReady =
  !SUPABASE_URL.startsWith("PASTE_") &&
  !SUPABASE_PUBLISHABLE_KEY.startsWith("PASTE_");
const db = leaderboardReady
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)
  : null;

let order=[],idx=0,correct=0,player="",startedAt=0;
const $=s=>document.querySelector(s);
function norm(s){return (s||"").trim().replace(/\s+/g,"").toLowerCase();}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function screen(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$('#'+id).classList.add('active')}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}

function boardLoading(target,msg){
  target.innerHTML='<div class="small">'+escapeHtml(msg)+'</div>';
}

function boardHtml(rows){
  const medals=['🥇','🥈','🥉'];
  if(!rows || !rows.length){
    return '<div class="small">아직 기록이 없습니다. 첫 번째 챔피언이 되어보세요!</div>';
  }
  return rows.map((r,i)=>`
    <div class="hofrow">
      <div class="medal">${medals[i]||'🏅'}</div>
      <div>
        <b>${escapeHtml(r.player_name)}</b>
        <div class="meta">${r.correct_count}/22 정답 · ${new Date(r.completed_at).toLocaleString('ko-KR')}</div>
      </div>
      <div class="score">${r.score}점</div>
    </div>`).join('');
}

async function loadLeaderboard(){
  const targets=[document.querySelector('#hofStart'),document.querySelector('#hofFinal')].filter(Boolean);

  if(!leaderboardReady){
    targets.forEach(t=>boardLoading(t,'Supabase 연결 전입니다. 프로젝트 URL과 Publishable Key를 넣으면 모든 참가자가 같은 TOP 3를 보게 됩니다.'));
    return;
  }

  targets.forEach(t=>boardLoading(t,'명예의 전당을 불러오는 중입니다...'));

  const {data,error}=await db
    .from('leaderboard')
    .select('player_name, score, correct_count, completed_at')
    .order('score',{ascending:false})
    .order('completed_at',{ascending:false})
    .limit(3);

  if(error){
    console.error(error);
    targets.forEach(t=>boardLoading(t,'명예의 전당을 불러오지 못했습니다. Supabase 설정을 확인해주세요.'));
    return;
  }

  const html=boardHtml(data);
  targets.forEach(t=>t.innerHTML=html);
}

async function saveSharedScore(row){
  if(!leaderboardReady) return {ok:false, message:'Supabase 연결 전이라 점수가 온라인에 저장되지 않았습니다.'};

  const {error}=await db
    .from('leaderboard')
    .insert({
      player_name: row.name,
      correct_count: row.correct,
      total_questions: 22,
      elapsed_seconds: row.elapsed
    });

  if(error){
    console.error(error);
    return {ok:false, message:'온라인 점수 저장에 실패했습니다.'};
  }
  return {ok:true};
}

function audioCtx(){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;window.__ac=window.__ac||new C();return window.__ac}
function tone(freq,at,dur,type='sine',vol=.11){const ac=audioCtx();if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(vol,ac.currentTime+at);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+at+dur);o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+at);o.stop(ac.currentTime+at+dur)}
function correctSound(){[523,659,784,1047].forEach((f,i)=>tone(f,i*.09,.32))}
function wrongSound(){tone(240,0,.25,'sawtooth',.09);tone(170,.18,.35,'sawtooth',.08)}
function showOverlay(ok){$('#ovEmoji').textContent=ok?'🎉':'😭';$('#ovText').textContent=ok?'정답!':'틀렸어요!';$('#ovText').className='bigtext '+(ok?'yay':'cry');$('#overlay').classList.add('show');setTimeout(()=>$('#overlay').classList.remove('show'),650)}
function confetti(){const box=$('#confetti');box.innerHTML='';const colors=['#ff72ae','#ffd66f','#75dfc2','#8eb8ff','#b69cff'];for(let i=0;i<55;i++){const e=document.createElement('i');e.style.left=Math.random()*100+'vw';e.style.background=colors[Math.floor(Math.random()*colors.length)];e.style.animationDelay=Math.random()*.3+'s';e.style.animationDuration=(.9+Math.random()*.7)+'s';box.appendChild(e)}setTimeout(()=>box.innerHTML='',1700)}

function renderAnswerGallery(){
  const grid=$('#answerGrid');
  if(!grid) return;
  grid.innerHTML=PEOPLE.map((p,i)=>`
    <div class="answerCard">
      <div class="answerPhoto"><img src="${p.img}" alt="${escapeHtml(p.name)} 얼굴 사진"></div>
      <div class="answerName">${escapeHtml(p.name)}</div>
    </div>
  `).join('');
}

function toggleAnswerGallery(){
  const panel=$('#answerPanel');
  const btn=$('#answerBtn');
  const isOpen=panel.classList.toggle('show');
  btn.textContent=isOpen?'정답 닫기':'얼굴 · 이름 정답 보기';
  if(isOpen){
    renderAnswerGallery();
    panel.scrollIntoView({behavior:'smooth',block:'start'});
  }
}

function showQuestion(){const p=order[idx];$('#face').src=p.img;$('#attempted').textContent=idx;$('#correct').textContent=correct;$('#bar').style.width=(idx/PEOPLE.length*100)+'%';$('#answer').value='';$('#status').textContent='';$('#status').className='status';setTimeout(()=>$('#answer').focus(),60)}
function submit(){if(idx>=order.length)return;const entered=norm($('#answer').value);if(!entered)return;const ok=entered===norm(order[idx].name);if(ok){correct++;correctSound();confetti();showOverlay(true);$('#status').textContent='맞췄습니다! ✨';$('#status').className='status good';}else{wrongSound();showOverlay(false);$('#status').textContent='틀렸어요ㅠㅠ 정답은 '+order[idx].name+'입니다! 다음 문제로 넘어갑니다!';$('#status').className='status bad';}idx++;$('#attempted').textContent=idx;$('#correct').textContent=correct;$('#bar').style.width=(idx/PEOPLE.length*100)+'%';if(idx===PEOPLE.length)setTimeout(finish,700);else setTimeout(showQuestion,700);}
async function finish(){
  const elapsed=Math.max(1,Math.round((Date.now()-startedAt)/1000));
  const score=correct*100;
  const completedAt=Date.now();

  $('#finalName').textContent=player+' 님, 수고하셨습니다!';
  $('#finalScore').textContent=score+'점';
  $('#finalDetail').textContent=`총 22문제 중 ${correct}문제 정답 · ${Math.floor(elapsed/60)}분 ${elapsed%60}초`;
  screen('final');
  $('#answerPanel').classList.remove('show');
  $('#answerBtn').textContent='얼굴 · 이름 정답 보기';
  confetti();

  const result=await saveSharedScore({
    name:player,
    correct,
    score,
    elapsed,
    completedAt
  });

  if(!result.ok){
    $('#finalDetail').textContent += ' · ' + result.message;
  }
  await loadLeaderboard();
}
function begin(){const n=$('#playerName').value.trim();if(!n){$('#playerName').focus();return}player=n;idx=0;correct=0;startedAt=Date.now();order=shuffle(PEOPLE.slice());$('#playerBadge').textContent='도전자 '+player;screen('game');showQuestion()}
$('#answerBtn').addEventListener('click',toggleAnswerGallery);
$('#startBtn').addEventListener('click',begin);$('#playerName').addEventListener('keydown',e=>{if(e.key==='Enter')begin()});$('#submitBtn').addEventListener('click',submit);$('#answer').addEventListener('keydown',e=>{if(e.key==='Enter')submit()});$('#againBtn').addEventListener('click',()=>{idx=0;correct=0;startedAt=Date.now();order=shuffle(PEOPLE.slice());screen('game');showQuestion()});$('#homeBtn').addEventListener('click',()=>{screen('start');loadLeaderboard()});loadLeaderboard();

document.addEventListener('visibilitychange',()=>{
  if(!document.hidden) loadLeaderboard();
});
</script>
</body></html>
